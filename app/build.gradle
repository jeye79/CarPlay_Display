plugins {
    id 'com.android.application'
}

android {
    namespace 'com.ottocast.dimmer'
    compileSdk 34

    defaultConfig {
        applicationId "com.ottocast.dimmer"
        minSdk 26
        targetSdk 30
        versionCode 1
        versionName "1.0.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}
